[project]
name = "prompttrace"
version = "0.1.0"
description = "Local-first parallel prompt experiment workbench"
authors = [
    {name = "yasumassa",email = "yasumasa.takemura@cafkah.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
flask = ">=3.0,<4"
prompttrace-importer = { path = "packages/importer/python", develop = true }
prompttrace-ui = { path = "packages/ui/python", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"