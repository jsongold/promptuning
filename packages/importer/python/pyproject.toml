[project]
name = "prompttrace-importer"
version = "0.1.0"
description = "PromptTrace analysis importer: JSONL sinks to a DuckDB analysis store"
readme = "../../../README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0"
]

[project.scripts]
prompttrace = "prompttrace_importer.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"